<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Local preview — Siya Circle Carepatron embed</title>
  <style>
    :root { --cream:#f7f5f2; --navy:#1f2a37; --sage:#6b8f71; }
    body { margin:0; font-family: "Avenir Next", "Segoe UI", sans-serif; background: var(--cream); color: var(--navy); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    p { color: #5c6570; line-height: 1.5; }
    .note { background: #fff; border: 1px solid rgba(31,42,55,.12); border-radius: 12px; padding: 14px 16px; margin: 20px 0; font-size: .92rem; }
    .embed { display:grid; width:100%; min-width:320px; min-height:640px; background:#fff; border-radius: 12px; overflow:hidden; border:1px solid rgba(31,42,55,.12); }
    iframe { width:100%; min-height:640px; border:0; }
    a { color: var(--sage); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Siya Circle — Carepatron iframe preview</h1>
    <p>Local only. Not deployed. Uses Carepatron inline embed (<code>?e=i</code>).</p>
    <div class="note">
      If the frame is blank or errors, Carepatron may block some browsers/automation.
      Also try the direct link:
      <a href="https://form.carepatron.com/Forms/XRMFIPAWuXhTlncGx" target="_blank" rel="noopener">Open form</a>
    </div>
    <div class="embed">
      <iframe title="Join Siya Circle TM" src="https://form.carepatron.com/Forms/XRMFIPAWuXhTlncGx?e=i" loading="eager"></iframe>
    </div>
  </div>
<!-- SIYA:CONCIERGE -->
    <script src="/scripts/siya-concierge.js" defer></script>
    <!-- /SIYA:CONCIERGE -->
</body>
</html>
