<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="ir-visual-title">
  <title id="ir-visual-title">Insulin resistance visual: glucose, insulin, and cell response</title>
  <rect width="640" height="340" fill="#f9fafb" rx="16"/>
  <text x="320" y="32" text-anchor="middle" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Insulin resistance (simplified)</text>
  <rect x="60" y="70" width="220" height="180" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="360" y="70" width="220" height="180" rx="12" fill="#fff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="170" y="98" text-anchor="middle" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Typical response</text>
  <text x="470" y="98" text-anchor="middle" fill="#1e3a8a" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Insulin resistance</text>
  <circle cx="120" cy="160" r="28" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
  <text x="120" y="165" text-anchor="middle" fill="#1e3a8a" font-size="11" font-family="Inter,Arial,sans-serif">Cell</text>
  <path d="M180 160 L220 160" stroke="#0ea5a4" stroke-width="2" marker-end="url(#a1)"/>
  <text x="200" y="150" text-anchor="middle" fill="#6b7280" font-size="10" font-family="Inter,Arial,sans-serif">Insulin</text>
  <circle cx="420" cy="160" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="420" y="165" text-anchor="middle" fill="#92400e" font-size="11" font-family="Inter,Arial,sans-serif">Cell</text>
  <path d="M480 160 L520 160" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="500" y="150" text-anchor="middle" fill="#6b7280" font-size="10" font-family="Inter,Arial,sans-serif">Insulin ‘</text>
  <text x="170" y="220" text-anchor="middle" fill="#6b7280" font-size="11" font-family="Inter,Arial,sans-serif">Glucose enters cells</text>
  <text x="470" y="220" text-anchor="middle" fill="#6b7280" font-size="11" font-family="Inter,Arial,sans-serif">Glucose stays elevated;</text>
  <text x="470" y="236" text-anchor="middle" fill="#6b7280" font-size="11" font-family="Inter,Arial,sans-serif">more insulin needed</text>
  <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0ea5a4"/></marker></defs>
  <text x="320" y="320" text-anchor="middle" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="11">Normal A1c does not rule out insulin resistance</text>
</svg>
