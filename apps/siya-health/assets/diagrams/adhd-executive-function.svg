<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="adhd-ef-title">
  <title id="adhd-ef-title">ADHD executive function map: planning, focus, memory, impulse control, and time</title>
  <rect width="640" height="420" fill="#f9fafb" rx="16"/>
  <text x="320" y="36" text-anchor="middle" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Executive function domains</text>
  <circle cx="320" cy="210" r="70" fill="#1e3a8a"/>
  <text x="320" y="206" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">Adult ADHD</text>
  <text x="320" y="222" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="11">evaluation</text>
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="250" y="58" width="140" height="32" rx="16" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="320" y="79" text-anchor="middle" fill="#111827">Working memory</text>
    <rect x="470" y="130" width="140" height="32" rx="16" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="540" y="151" text-anchor="middle" fill="#111827">Focus &amp; attention</text>
    <rect x="470" y="258" width="140" height="32" rx="16" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="540" y="279" text-anchor="middle" fill="#111827">Impulse control</text>
    <rect x="250" y="330" width="140" height="32" rx="16" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="320" y="351" text-anchor="middle" fill="#111827">Time management</text>
    <rect x="30" y="258" width="140" height="32" rx="16" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="100" y="279" text-anchor="middle" fill="#111827">Planning</text>
    <rect x="30" y="130" width="140" height="32" rx="16" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="100" y="151" text-anchor="middle" fill="#111827">Task initiation</text>
  </g>
  <line x1="320" y1="140" x2="320" y2="90" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="380" y1="190" x2="470" y2="146" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="380" y1="230" x2="470" y2="274" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="320" y1="280" x2="320" y2="330" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="260" y1="230" x2="170" y2="274" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="260" y1="190" x2="170" y2="146" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="320" y="405" text-anchor="middle" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="11">Screening tools do not diagnoseclinical evaluation required</text>
</svg>
