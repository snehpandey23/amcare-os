<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="food-noise-title">
  <title id="food-noise-title">Food noise: persistent food thoughts versus physical hunger</title>
  <rect width="640" height="360" fill="#f9fafb" rx="16"/>
  <text x="320" y="36" text-anchor="middle" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">Food noise vs. physical hunger</text>
  <rect x="40" y="60" width="260" height="240" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="340" y="60" width="260" height="240" rx="12" fill="#fff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="170" y="92" text-anchor="middle" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Physical hunger</text>
  <text x="470" y="92" text-anchor="middle" fill="#1e3a8a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">Food noise</text>
  <g fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="12">
    <text x="60" y="130">" Builds gradually</text>
    <text x="60" y="158">" Any food can satisfy</text>
    <text x="60" y="186">" Stops when full</text>
    <text x="60" y="214">" Felt in stomach</text>
  </g>
  <g fill="#111827" font-family="Inter,Arial,sans-serif" font-size="12">
    <text x="360" y="130">" Sudden, intrusive thoughts</text>
    <text x="360" y="158">" Specific cravings</text>
    <text x="360" y="186">" Hard to ignore</text>
    <text x="360" y="214">" Persists after eating</text>
    <text x="360" y="242">" Often linked to GLP-1 changes</text>
  </g>
  <path d="M170 280 Q320 320 470 280" fill="none" stroke="#0ea5a4" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0ea5a4"/></marker></defs>
  <text x="320" y="340" text-anchor="middle" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="11">A clinician can help distinguish patterns—not a self-diagnosis tool</text>
</svg>
