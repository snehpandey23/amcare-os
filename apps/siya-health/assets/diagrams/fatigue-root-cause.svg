<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fatigue-map-title">
  <title id="fatigue-map-title">Fatigue root cause map: sleep, metabolic, hormonal, and lifestyle factors</title>
  <rect width="640" height="380" fill="#f9fafb" rx="16"/>
  <text x="320" y="34" text-anchor="middle" fill="#111827" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">When rest doesn't fix fatigue</text>
  <ellipse cx="320" cy="190" rx="90" ry="50" fill="#1e3a8a"/>
  <text x="320" y="186" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Chronic</text>
  <text x="320" y="202" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">fatigue</text>
  <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#111827">
    <rect x="40" y="60" width="120" height="56" rx="10" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="100" y="84" text-anchor="middle">Sleep</text><text x="100" y="100" text-anchor="middle" fill="#6b7280" font-size="10">apnea, insomnia</text>
    <rect x="480" y="60" width="120" height="56" rx="10" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="540" y="84" text-anchor="middle">Metabolic</text><text x="540" y="100" text-anchor="middle" fill="#6b7280" font-size="10">insulin, weight</text>
    <rect x="40" y="264" width="120" height="56" rx="10" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="100" y="288" text-anchor="middle">Hormonal</text><text x="100" y="304" text-anchor="middle" fill="#6b7280" font-size="10">thyroid, testosterone</text>
    <rect x="480" y="264" width="120" height="56" rx="10" fill="#fff" stroke="#0ea5a4" stroke-width="2"/><text x="540" y="288" text-anchor="middle">Focus overlap</text><text x="540" y="304" text-anchor="middle" fill="#6b7280" font-size="10">ADHD, burnout</text>
  </g>
  <line x1="160" y1="88" x2="240" y2="165" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="480" y1="88" x2="400" y2="165" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="160" y1="292" x2="250" y2="215" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="480" y1="292" x2="390" y2="215" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="320" y="360" text-anchor="middle" fill="#6b7280" font-family="Inter,Arial,sans-serif" font-size="11">Clinician-led workupnot a substitute for emergency care</text>
</svg>
