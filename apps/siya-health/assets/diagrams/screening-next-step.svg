<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 88" role="img" aria-labelledby="sns-title sns-desc">
  <title id="sns-title">From screening to a conversation</title>
  <desc id="sns-desc">A simple path: screening complete, then a free Meet and Greet conversation. Not a diagnosis.</desc>
  <!-- Soft band -->
  <rect width="520" height="88" rx="16" fill="#F5F7FA"/>
  <!-- Step 1: checklist -->
  <g transform="translate(28 16)">
    <circle cx="28" cy="28" r="28" fill="#E8EEF8"/>
    <rect x="16" y="16" width="24" height="28" rx="3" fill="none" stroke="#1E3A8A" stroke-width="2"/>
    <path d="M22 28 l5 5 10-12" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="56" y="78" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Screening done</text>
  <!-- Arrow -->
  <path d="M118 44 H198" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M190 36 l10 8 -10 8" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 2: conversation -->
  <g transform="translate(214 16)">
    <circle cx="28" cy="28" r="28" fill="#E6F4F2"/>
    <path d="M14 24c0-7 7-12 14-12s14 5 14 12c0 5-3 9-8 11v7l-8-5c-7 0-12-6-12-13z" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="22" cy="24" r="1.6" fill="#0F766E"/>
    <circle cx="28" cy="24" r="1.6" fill="#0F766E"/>
    <circle cx="34" cy="24" r="1.6" fill="#0F766E"/>
  </g>
  <text x="242" y="78" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Talk it through</text>
  <!-- Arrow -->
  <path d="M304 44 H384" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M376 36 l10 8 -10 8" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Step 3: calm next -->
  <g transform="translate(400 16)">
    <circle cx="28" cy="28" r="28" fill="#EEF2FF"/>
    <path d="M18 30c4-10 16-14 24-6 2 2 3 5 3 8" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="40" cy="36" r="3" fill="#0F766E"/>
    <path d="M20 40 h16" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="428" y="78" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Clear next step</text>
</svg>
