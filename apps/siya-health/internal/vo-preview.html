<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voiceover edge trims — not wired</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 16px/1.45 "Iowan Old Style", Palatino, Georgia, serif; color: #142033; background: #f6f3ee; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 1.45rem; font-weight: 600; margin: 0 0 6px; }
  .note { color: #4a5568; margin: 0 0 22px; }
  article { background: #fff; border-radius: 14px; padding: 14px 16px 16px; margin: 0 0 12px; box-shadow: 0 1px 0 rgba(20,32,51,.06); }
  h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .why { margin: 0 0 10px; color: #4a5568; font: 14px/1.4 system-ui, sans-serif; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font: 12px/1 ui-monospace, monospace; color: #5c6778; margin: 0 0 4px; }
  audio { width: 100%; }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Changed voiceover clips</h1>
  <p class="note">Preview only. Nothing here is wired into the demo, and nothing plays until you press play. Each row is a clip whose opening syllable was cut. Listen to the start: old file first, then the trim.</p>
  <div id="list"></div>
</main>
<script type="application/json" id="rows">
[
  {"id":"p-away","file":"03-p-away.mp3","why":"Opening syllable 0.01–0.36s, then silence until “On” at 1.11s."},
  {"id":"p-familiar","file":"04-p-familiar.mp3","why":"“Doctor” at 0.01–0.27s, then silence until “And” at 1.03s."},
  {"id":"p-coord","file":"07-p-coord.mp3","why":"Opening syllable 0.00–0.30s, then silence until “And” at 1.10s."},
  {"id":"turn","file":"09-turn.mp3","why":"Opening syllable 0.01–0.24s, then silence until “That's” at 0.98s."},
  {"id":"f-ways","file":"12-f-ways.mp3","why":"Opening syllable 0.00–0.22s, then silence until “They” at 1.07s."},
  {"id":"f-whole","file":"15-f-whole.mp3","why":"Opening syllable 0.01–0.15s, then silence until “And” at 1.12s."},
  {"id":"journey","file":"17-journey.mp3","why":"Opening syllable 0.02–0.44s, then silence until “From” at 1.12s."},
  {"id":"outcomes","file":"18-outcomes.mp3","why":"Opening syllable 0.00–0.26s, then silence until “Your” at 1.10s."},
  {"id":"cost","file":"20-cost.mp3","why":"Opening click 0.01–0.09s, then silence until “No” at 0.76s."},
  {"id":"privacy","file":"21-privacy.mp3","why":"Opening syllable 0.01–0.35s, then silence until “Their” at 1.06s."},
  {"id":"proof","file":"22-proof.mp3","why":"Opening syllable 0.02–0.22s, then silence until “More” at 1.16s."},
  {"id":"e2-focus","file":"24-e2-focus.mp3","why":"Opening syllable 0.01–0.32s, then silence until “Sharper” at 0.93s."},
  {"id":"e3-outcomes","file":"25-e3-outcomes.mp3","why":"Opening syllable 0.00–0.22s, then silence until “Measured” at 0.86s."},
  {"id":"e4-simple","file":"26-e4-simple.mp3","why":"Opening phrase 0.00–0.48s, then silence until “And” at 1.00s."}
]
</script>
<script>
const rows = JSON.parse(document.getElementById('rows').textContent);
const list = document.getElementById('list');
for (const row of rows) {
  const article = document.createElement('article');
  article.innerHTML =
    '<h2>' + row.id + '</h2>' +
    '<p class="why">' + row.why + '</p>' +
    '<div class="pair">' +
      '<div><label>OLD</label><audio controls preload="none" src="vo-compare/' + row.file + '"></audio></div>' +
      '<div><label>NEW</label><audio controls preload="none" src="../employers/demo/media/vo/' + row.file + '"></audio></div>' +
    '</div>';
  list.appendChild(article);
}
</script>
</body>
</html>
