## Citations

### C1 — Systematic review
- Osianlis E, Thomas EHX, Jenkins LM, Gurvich C. ADHD and Sex Hormones in Females: A Systematic Review. J Atten Disord. 2025.
- URL: https://pmc.ncbi.nlm.nih.gov/articles/PMC12145478/
- N studies: 11
- Finding: Suggestive association between sex hormones / hormonal phases (puberty, menstrual cycle) and ADHD symptom change in females. Menopause under-researched.
- Limitation: Small samples, heterogeneous methods — **do not overstate**.

### C2 — Premenstrual stimulant adjustment (case series)
- de Jong M et al. Female-specific pharmacotherapy in ADHD: premenstrual adjustment of psychostimulant dosage. Front Psychiatry. 2023.
- URL: https://pmc.ncbi.nlm.nih.gov/articles/PMC10751335/
- N: 9 women; +30–50% dose premenstrually; reported benefit for ADHD/mood; follow-up 6–24 mo.
- Limitation: Not RCT; selected patients; **not a public dosing protocol**.

### C3 — Lifelong hormonal interplay review
- Research advances in female ADHD / hormonal fluctuations (2025). PMC12277363.
- Themes: puberty, cycle, pregnancy, peri/menopause; estrogen–dopamine framing; high self-report of premenstrual mood/focus worsening in ADHD populations surveyed.
- Limitation: Mix of review + survey — cite cautiously.

### C4 — Experimental amphetamine × cycle
- White TL et al. / related literature: subjective stimulant effects can differ follicular vs luteal.
- Use: supports “meds may feel different across cycle,” not automatic dose change.

