## Citations

### C1 — Adult comorbidity cohort
- Hansen TF et al. Comorbidity of migraine with ADHD in adults. BMC Neurology. 2018;18:147.
- URL: https://link.springer.com/article/10.1186/s12883-018-1149-6
- N: 26,456 Danish blood donors (18–65)
- Finding: Migraine associated with ADHD symptoms OR=1.8 (95% CI 1.5–2.1); stronger with migraine + visual disturbance (OR≈2.05)
- Limitation: Cross-sectional; self-report SQM + ASRS; healthy donor population (may underestimate)

### C2 — Secondary explainer
- Charlie Health. What’s the Link Between ADHD and Migraines?
- URL: https://www.charliehealth.com/mental-health/neurodivergence/adhd-and-migraines
- Themes: bidirectional risk; dopamine; genetics; stress; mixed stimulant effects; aura association
- Use: framing only — not primary evidence

