## Citations (science layer)

### C1 — Shared genetics / insulin-related traits
- Multivariate / factor models linking ADHD traits with IR-related traits (BMI, glucose, HbA1c) in population genetics (preprint / related Nature insulinopathy literature).
- Use: shared liability framing — **not** “IR causes ADHD.”

### C2 — MetS / T2D ↔ ADHD
- Observational comorbidity + Mendelian randomization literature suggesting bidirectional / shared risk with metabolic syndrome and T2D.
- Use: association strong enough to educate; still confounded by lifestyle and comorbidity.

### C3 — Adult ADHD metabolic outpatient studies
- Higher MetS / IR signals in some adult ADHD clinical samples.
- Limitation: clinic samples, BMI/meds/sleep confounders.

### C4 — T1D glycemic control meta (adjacent only)
- ADHD associated with worse glycemic outcomes in T1D in meta-analysis.
- **Out of scope for IR carousel** unless clearly labeled diabetes-management education.

