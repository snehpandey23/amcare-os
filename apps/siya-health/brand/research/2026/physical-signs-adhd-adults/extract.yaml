# Research extract — Physical signs of ADHD (adults)

pillar: brain-health-adhd
date: 2026-08-05
proposed_insight_id: AD-P-01
clinical_review_required: true
evidence_level: ClinicalPractice + Experiential (community) — body signs are recognized hyperactivity expressions, not standalone diagnostic criteria
synthesis: SYNTHESIS.md

## Citations (selected)

### C1 — Adult ADHD clinical overviews
- Mayo Clinic; Cleveland Clinic; ADDA adult symptom guides
- Finding: Adult hyperactivity often subtler — fidgeting, restlessness, inner motor; inattentive presentation may lack overt physical hyperactivity
- Limitation: Consumer education pages — use for framing, not novel claims

### C2 — European adult ADHD consensus
- Updated European Consensus Statement on diagnosis and treatment of adult ADHD
- Finding: Inner restlessness, fidgeting, restless sleep; sitting calmly in assessment does not exclude ADHD
- Limitation: Consensus statement — cite as clinical practice, not single RCT

### C3 — Sleep / RLS comorbidity
- Systematic review ADHD×RLS; Frontiers and journal studies on adult ADHD sleep problems
- Finding: High rates of sleep disturbance and RLS-like symptoms among adults with ADHD; association ≠ identity
- Limitation: Self-report inflation; comorbidity ≠ diagnostic criterion for ADHD

### C4 — Community (Reddit r/ADHD + related)
- Visible symptoms thread; physical ADHD discussion; fidgeting threads; anxiety vs ADHD restlessness; “can clinicians tell”
- Finding: Lived body signs + skepticism of overhyped physical-sign content
- Limitation: Experiential; selection bias; not clinical evidence

### C5 — Lifestyle / press “surprising signs”
- Telegraph / Good Housekeeping / HuffPost-style lists
- Finding: Physical and surprising signs circulate widely; thin differential diagnosis
- Limitation: Listicle risk of overclaim — use as competitive content map

## Insights (patient_why)

