## Limitations
- Physical manifestations are not DSM diagnostic criteria as a standalone set
- High symptom overlap with anxiety, sleep disorders, iron deficiency, thyroid, caffeine/stimulants
- Community sources over-index on visible hyperactivity relative to inattentive presentations

## Out of scope
- Diagnosing ADHD from photos/video of fidgeting
- Claiming hypermobility, clumsiness, or joint issues as definitive ADHD signs
- Child classroom hyperactivity framing as primary angle
- Founder LinkedIn posts unless requested
- Treatment/medication dosing advice in this pack
