<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8" />
<title>PE-B-01 slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --purple: #7B2CBF;
    --pink: #FF66C4;
    --blue: #0072CE;
    --deep: #4C1D95;
    --lavender: #A78BFA;
    --ink: #2A2A2E;
    --muted: #5C5C66;
    --cream: #F7F4EF;
    --cream2: #F0EBE3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #222;
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 78% 72%, rgba(123,44,191,0.10), transparent 60%),
      radial-gradient(ellipse 55% 45% at 18% 85%, rgba(0,114,206,0.08), transparent 55%),
      linear-gradient(165deg, var(--cream) 0%, var(--cream2) 100%);
    color: var(--ink);
    padding: 56px 64px 72px;
  }
  .logo {
    position: absolute;
    top: 44px;
    left: 52px;
    height: 56px;
    width: auto;
    z-index: 5;
  }
  .watermark {
    position: absolute;
    top: 36px;
    right: 40px;
    height: 220px;
    width: auto;
    opacity: 0.10;
    z-index: 1;
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 3;
    margin-top: 100px;
    max-width: 720px;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 28px;
    background: linear-gradient(90deg, var(--purple), var(--pink), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  h1.gradient {
    background: linear-gradient(100deg, var(--purple) 0%, var(--pink) 48%, var(--blue) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1.blue {
    background: linear-gradient(100deg, #0072CE, #5B9FE8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1.lavender {
    background: linear-gradient(100deg, #7B2CBF, #C4B5FD);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1.deep {
    background: linear-gradient(100deg, #4C1D95, #7B2CBF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .support {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--muted);
    max-width: 640px;
  }
  .tagline {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 120px;
    z-index: 4;
    font-size: 24px;
    font-weight: 600;
    color: var(--purple);
    letter-spacing: -0.01em;
  }
  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 40px;
    z-index: 5;
    border-top: 1px solid rgba(42,42,46,0.12);
    padding-top: 16px;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: rgba(42,42,46,0.55);
    letter-spacing: 0.01em;
  }
  .art {
    position: absolute;
    z-index: 2;
    pointer-events: none;
  }
  /* Cover brain */
  .brain {
    right: -40px;
    bottom: 80px;
    width: 560px;
    height: 560px;
  }
  /* Neuron */
  .neuron {
    right: -20px;
    bottom: 100px;
    width: 520px;
    height: 520px;
  }
  /* Waves */
  .waves {
    right: -60px;
    bottom: 60px;
    width: 580px;
    height: 520px;
  }
  /* Night */
  .night {
    right: -30px;
    bottom: 70px;
    width: 540px;
    height: 540px;
  }
  /* Close field */
  .field {
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    margin-top: 40px;
    padding: 18px 36px;
    border-radius: 10px;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(100deg, var(--purple), var(--pink) 55%, var(--blue));
    letter-spacing: 0.01em;
  }
  .slide-close .content {
    margin-top: 180px;
    max-width: 820px;
  }
  .slide-close h1 { font-size: 56px; }
</style>
</head><body style="margin:0;background:#F7F4EF;"><section class="slide" id="slide-02">
  <img class="logo" src="file:///workspace/apps/siya-health/brand/editorial-packs/PE-B-01/design/siya-health-logo.png" alt="Siya Health" />
  <img class="watermark" src="file:///workspace/apps/siya-health/brand/editorial-packs/PE-B-01/design/siya-health-logo.png" alt="" />
  <div class="content">
    <div class="eyebrow" style="background:linear-gradient(90deg,#0072CE,#5B9FE8);-webkit-background-clip:text;background-clip:text;color:transparent;">Semax</div>
    <h1 class="blue">Semax — studied for focus</h1>
    <p class="support">Researched in memory, attention, and brain-protection contexts. Evidence is limited and compound-specific.</p>
  </div>
  <svg class="art neuron" viewBox="0 0 520 520" aria-hidden="true">
    <defs>
      <radialGradient id="g2" cx="55%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#5B9FE8" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#0072CE" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="stroke2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0072CE"/>
        <stop offset="100%" stop-color="#7B2CBF"/>
      </linearGradient>
    </defs>
    <circle cx="280" cy="250" r="180" fill="url(#g2)"/>
    <circle cx="260" cy="240" r="28" fill="none" stroke="url(#stroke2)" stroke-width="5"/>
    <line x1="260" y1="212" x2="200" y2="120" stroke="url(#stroke2)" stroke-width="3.5"/>
    <line x1="285" y1="225" x2="380" y2="140" stroke="url(#stroke2)" stroke-width="3.5"/>
    <line x1="285" y1="255" x2="400" y2="280" stroke="url(#stroke2)" stroke-width="3.5"/>
    <line x1="245" y1="260" x2="140" y2="320" stroke="url(#stroke2)" stroke-width="3.5"/>
    <line x1="255" y1="268" x2="220" y2="380" stroke="url(#stroke2)" stroke-width="3.5"/>
    <circle cx="200" cy="120" r="10" fill="#0072CE" opacity="0.8"/>
    <circle cx="380" cy="140" r="9" fill="#5B9FE8" opacity="0.85"/>
    <circle cx="400" cy="280" r="11" fill="#0072CE" opacity="0.75"/>
    <circle cx="140" cy="320" r="8" fill="#7B2CBF" opacity="0.7"/>
    <circle cx="220" cy="380" r="9" fill="#5B9FE8" opacity="0.8"/>
    <circle cx="320" cy="200" r="4" fill="#0072CE"/>
    <circle cx="180" cy="220" r="4" fill="#5B9FE8"/>
    <circle cx="340" cy="320" r="4" fill="#0072CE"/>
  </svg>
  <div class="footer">siya.health · All content for educational purposes only</div>
</section></body></html>
