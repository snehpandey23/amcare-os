<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8" />
<title>PE-B-01 slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --purple: #7B2CBF;
    --pink: #FF66C4;
    --blue: #0072CE;
    --deep: #4C1D95;
    --lavender: #A78BFA;
    --ink: #2A2A2E;
    --muted: #5C5C66;
    --cream: #F7F4EF;
    --cream2: #F0EBE3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #222;
    font-family: "Montserrat", system-ui, sans-serif;
  }
  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 78% 72%, rgba(123,44,191,0.10), transparent 60%),
      radial-gradient(ellipse 55% 45% at 18% 85%, rgba(0,114,206,0.08), transparent 55%),
      linear-gradient(165deg, var(--cream) 0%, var(--cream2) 100%);
    color: var(--ink);
    padding: 56px 64px 72px;
  }
  .logo {
    position: absolute;
    top: 44px;
    left: 52px;
    height: 56px;
    width: auto;
    z-index: 5;
  }
  .watermark {
    position: absolute;
    top: 36px;
    right: 40px;
    height: 220px;
    width: auto;
    opacity: 0.10;
    z-index: 1;
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 3;
    margin-top: 100px;
    max-width: 720px;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 28px;
    background: linear-gradient(90deg, var(--purple), var(--pink), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  h1.gradient {
    background: linear-gradient(100deg, var(--purple) 0%, var(--pink) 48%, var(--blue) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1.blue {
    background: linear-gradient(100deg, #0072CE, #5B9FE8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1.lavender {
    background: linear-gradient(100deg, #7B2CBF, #C4B5FD);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1.deep {
    background: linear-gradient(100deg, #4C1D95, #7B2CBF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .support {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--muted);
    max-width: 640px;
  }
  .tagline {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 120px;
    z-index: 4;
    font-size: 24px;
    font-weight: 600;
    color: var(--purple);
    letter-spacing: -0.01em;
  }
  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 40px;
    z-index: 5;
    border-top: 1px solid rgba(42,42,46,0.12);
    padding-top: 16px;
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: rgba(42,42,46,0.55);
    letter-spacing: 0.01em;
  }
  .art {
    position: absolute;
    z-index: 2;
    pointer-events: none;
  }
  /* Cover brain */
  .brain {
    right: -40px;
    bottom: 80px;
    width: 560px;
    height: 560px;
  }
  /* Neuron */
  .neuron {
    right: -20px;
    bottom: 100px;
    width: 520px;
    height: 520px;
  }
  /* Waves */
  .waves {
    right: -60px;
    bottom: 60px;
    width: 580px;
    height: 520px;
  }
  /* Night */
  .night {
    right: -30px;
    bottom: 70px;
    width: 540px;
    height: 540px;
  }
  /* Close field */
  .field {
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    margin-top: 40px;
    padding: 18px 36px;
    border-radius: 10px;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(100deg, var(--purple), var(--pink) 55%, var(--blue));
    letter-spacing: 0.01em;
  }
  .slide-close .content {
    margin-top: 180px;
    max-width: 820px;
  }
  .slide-close h1 { font-size: 56px; }
</style>

  <img class="watermark" src="file:///workspace/apps/siya-health/brand/editorial-packs/PE-B-01/design/siya-health-logo.png" alt="" />
  <div class="content">

  <p class="tagline">Hope isn’t proof — peptides need evidence.</p>
  <svg class="art brain" viewBox="0 0 560 560" aria-hidden="true">
    <defs>
      <radialGradient id="g1" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="#FF66C4" stop-opacity="0.55"/>

        <stop offset="100%" stop-color="#0072CE" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="stroke1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7B2CBF"/>
        <stop offset="50%" stop-color="#FF66C4"/>
        <stop offset="100%" stop-color="#0072CE"/>
      </linearGradient>
    </defs>
    <circle cx="280" cy="260" r="200" fill="url(#g1)"/>
    <path d="M180 200c20-70 90-110 160-100 70 10 120 70 120 140 0 40-15 70-40 95 30 20 45 55 35 95-15 55-75 85-130 70-25 35-70 50-110 35-55-20-80-80-55-130-35-25-50-70-35-110 15-45 55-75 95-95z"
          fill="none" stroke="url(#stroke1)" stroke-width="6" opacity="0.85"/>
    <path d="M220 230c40-20 90-15 120 20M250 300c50 10 95-5 130 25M200 340c45 25 100 30 150 10"
          fill="none" stroke="url(#stroke1)" stroke-width="3.5" opacity="0.7"/>
    <circle cx="240" cy="250" r="8" fill="#7B2CBF" opacity="0.7"/>
    <circle cx="320" cy="280" r="6" fill="#FF66C4" opacity="0.8"/>
    <circle cx="360" cy="340" r="7" fill="#0072CE" opacity="0.75"/>
  </svg>
  <div class="footer">siya.health · All content for educational purposes only</div>
</section></body></html>
