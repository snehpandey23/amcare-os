<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" />
<title>AD-P-01 slide 01 — Template A</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #1E2A5A;
    --magenta: #C2186B;
    --plum: #7B2CBF;
    --lavender: #EDE4FF;
    --cream: #FAFAFC;
    --cream2: #F5F1EB;
    --muted: #5C5C66;
    --footer-bg: #F3EEF8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; background: #FAFAFC; font-family: "Montserrat", system-ui, sans-serif; }
  .slide {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 50% 45% at 82% 38%, rgba(205,184,255,0.35), transparent 65%),
      linear-gradient(165deg, var(--cream) 0%, var(--cream2) 100%);
    color: var(--navy);
  }
  .logo {
    position: absolute;
    top: 40px;
    left: 48px;
    height: 58px;
    width: auto;
    z-index: 6;
  }
  .pill {
    position: absolute;
    top: 52px;
    right: 48px;
    z-index: 6;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--lavender);
    color: var(--plum);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .content {
    position: absolute;
    left: 56px;
    top: 160px;
    width: 520px;
    z-index: 5;
  }
  h1 {
    font-size: 54px;
    font-weight: 800;
    line-height: 1.14;
    letter-spacing: -0.02em;
    color: var(--navy);
    margin-bottom: 22px;
  }
  h1 .hi { color: var(--magenta); }
  .support {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--muted);
    max-width: 480px;
    margin-bottom: 28px;
  }
  .feeling {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 999px;
    background: #F8E7F0;
    color: var(--magenta);
    font-size: 20px;
    font-weight: 700;
  }
  .feeling::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--magenta);
  }
  .photo-wrap {
    position: absolute;
    right: 0;
    top: 120px;
    width: 500px;
    height: 720px;
    z-index: 2;
    overflow: hidden;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  .photo-fade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, var(--cream) 0%, rgba(250,250,252,0.55) 22%, transparent 48%),
      linear-gradient(180deg, var(--cream) 0%, transparent 14%),
      linear-gradient(0deg, var(--footer-bg) 0%, transparent 22%);
    z-index: 3;
    pointer-events: none;
  }
  .footer-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 8;
    background: var(--footer-bg);
    border-top: 1px solid rgba(30,42,90,0.08);
    padding: 22px 48px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .footer-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tagline {
    font-size: 16px;
    font-weight: 600;
    font-style: italic;
    color: var(--plum);
  }
  .contact {
    font-size: 18px;
    font-weight: 700;
    color: var(--navy);
  }
  .edu {
    font-size: 14px;
    font-weight: 500;
    color: rgba(30,42,90,0.55);
    text-align: right;
    max-width: 340px;
  }
</style>
</head><body>
<section class="slide" id="slide-01">
  <img class="logo" src="siya-health-logo.png" alt="Siya Health" />
  <div class="pill">Adult ADHD</div>

  <div class="content">
    <h1>Physical <span class="hi">signs</span> that may appear with ADHD</h1>
    <p class="support">— and why they’re not enough to diagnose.</p>
    <div class="feeling">Common isn’t conclusive</div>
  </div>

  <div class="photo-wrap">
    <img src="../images/bases/ad-p01-base-portrait.png" alt="" />
    <div class="photo-fade"></div>
  </div>

  <div class="footer-bar">
    <div class="footer-left">
      <div class="tagline">Care. Compassion. Connection.</div>
      <div class="contact">(215) 445-1244 · www.siya.health</div>
    </div>
    <div class="edu">siya.health · All content for educational purposes only</div>
  </div>
</section>
</body></html>
