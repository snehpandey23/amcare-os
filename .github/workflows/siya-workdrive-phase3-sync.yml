# DEPRECATED for API writes to the working delivery tree.
# Mid-upload fail tests → siya-workdrive-phase3-fail-test.yml (_FAIL-TEST-ONLY only).
# Human-gated delivery → siya-workdrive-phase3-live.yml.
#
# This workflow no longer runs API sync or simulate_fail_after against working folders.
name: Siya WorkDrive Phase-3 sync (dry-run) — retired

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type RETIRED to acknowledge this workflow no longer syncs"
        required: true
        default: ""

jobs:
  retired:
    if: ${{ github.event.inputs.acknowledge == 'RETIRED' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "This dry-run workflow previously shared WORKDRIVE_DRYRUN_* with live delivery."
          echo "Fail tests: Actions → Siya WorkDrive Phase-3 fail-test (_FAIL-TEST-ONLY)."
          echo "Delivery: Actions → Siya WorkDrive Phase-3 sync (live)."
          exit 0
