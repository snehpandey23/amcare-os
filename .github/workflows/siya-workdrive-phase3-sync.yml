# DORMANT — manual WorkDrive upload for now (2026-08-24).
# Do not enable push triggers until founder explicitly re-opens API sync.
# Kept for future dry-run only via workflow_dispatch.
name: Siya WorkDrive Phase-3 sync (dormant)

on:
  workflow_dispatch:
    inputs:
      insight_id:
        description: "Insight ID to sync (optional; default discover SHIP.md packs)"
        required: false
        default: ""
      transport:
        description: "fs (noop on GHA without path) or api"
        required: false
        default: "api"
      confirm_dormant_override:
        description: "Type RUN-DRY-RUN to allow this dormant workflow to execute"
        required: true
        default: ""

concurrency:
  group: siya-workdrive-phase3-test
  cancel-in-progress: false

jobs:
  sync-dry-run:
    if: ${{ github.event.inputs.confirm_dormant_override == 'RUN-DRY-RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Phase-3 sync (test / dry-run only)
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: ${{ secrets.ZOHO_ACCOUNTS_URL }}
          WORKDRIVE_DRYRUN_04_ID: ${{ secrets.WORKDRIVE_DRYRUN_04_ID }}
          WORKDRIVE_DRYRUN_05_ID: ${{ secrets.WORKDRIVE_DRYRUN_05_ID }}
          WORKDRIVE_DRYRUN_06_ID: ${{ secrets.WORKDRIVE_DRYRUN_06_ID }}
          WORKDRIVE_DRYRUN_07_ID: ${{ secrets.WORKDRIVE_DRYRUN_07_ID }}
          WORKDRIVE_SYNC_TRANSPORT: ${{ github.event.inputs.transport || 'api' }}
        run: |
          set -euo pipefail
          echo "git SHA: $(git rev-parse --short HEAD)"
          # Soft-skip if API secrets missing (do not fail the workflow)
          if [[ -z "${ZOHO_REFRESH_TOKEN:-}" || -z "${WORKDRIVE_DRYRUN_05_ID:-}" ]]; then
            echo "SKIP: Zoho dry-run secrets not configured yet (ZOHO_REFRESH_TOKEN / WORKDRIVE_DRYRUN_*_ID)."
            echo "Local FS tests use TrueSync _API-DRY-RUN until secrets are set."
            exit 0
          fi
          ARGS=(--config apps/siya-health/brand/scripts/workdrive_sync_config.test.json --transport api)
          if [[ -n "${{ github.event.inputs.insight_id }}" ]]; then
            ARGS+=(--insight-id "${{ github.event.inputs.insight_id }}")
          else
            ARGS+=(--discover-shipped)
          fi
          python3 apps/siya-health/brand/scripts/workdrive_phase3_sync.py "${ARGS[@]}"
