# Dry-run / verification only until Option-2 live flip is approved.
# Normal human-gated live sync will use a separate push-to-main workflow after gates pass.
name: Siya WorkDrive Phase-3 sync (dry-run)

on:
  workflow_dispatch:
    inputs:
      insight_id:
        description: "Insight ID to sync"
        required: true
        default: "TEST-2026-08-24-api-dryrun"
      transport:
        description: "api (required for real WorkDrive dry-run)"
        required: false
        default: "api"
      simulate_fail_after:
        description: "TEST: abort after N uploads then rollback (0 = normal sync)"
        required: false
        default: "0"
      confirm_dormant_override:
        description: "Type RUN-DRY-RUN to allow this workflow to execute"
        required: true
        default: ""

concurrency:
  group: siya-workdrive-phase3-test
  cancel-in-progress: false

jobs:
  sync-dry-run:
    if: ${{ github.event.inputs.confirm_dormant_override == 'RUN-DRY-RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Phase-3 sync (dry-run folders only)
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNTS_URL: ${{ secrets.ZOHO_ACCOUNTS_URL }}
          WORKDRIVE_DRYRUN_04_ID: ${{ secrets.WORKDRIVE_DRYRUN_04_ID }}
          WORKDRIVE_DRYRUN_05_ID: ${{ secrets.WORKDRIVE_DRYRUN_05_ID }}
          WORKDRIVE_DRYRUN_06_ID: ${{ secrets.WORKDRIVE_DRYRUN_06_ID }}
          WORKDRIVE_DRYRUN_07_ID: ${{ secrets.WORKDRIVE_DRYRUN_07_ID }}
          WORKDRIVE_SYNC_TRANSPORT: api
          WORKDRIVE_SIMULATE_FAIL_AFTER: ${{ github.event.inputs.simulate_fail_after }}
        run: |
          set -euo pipefail
          echo "git SHA: $(git rev-parse HEAD)"
          grep -n "SCRIPT_VERSION" apps/siya-health/brand/scripts/workdrive_phase3_sync.py | head -3
          if [[ -z "${ZOHO_REFRESH_TOKEN:-}" || -z "${WORKDRIVE_DRYRUN_05_ID:-}" ]]; then
            echo "SKIP: secrets missing"
            exit 0
          fi
          # Exit 2 from simulate-fail is expected success for the failure test.
          set +e
          python3 apps/siya-health/brand/scripts/workdrive_phase3_sync.py \
            --config apps/siya-health/brand/scripts/workdrive_sync_config.test.json \
            --transport api \
            --allow-test-ids \
            --insight-id "${{ github.event.inputs.insight_id }}"
          code=$?
          set -e
          fail_after="${{ github.event.inputs.simulate_fail_after }}"
          if [[ "${fail_after}" != "0" && -n "${fail_after}" ]]; then
            if [[ "$code" -eq 2 ]]; then
              echo "PASS: deliberate mid-upload failure exited 2 (rollback path)"
              exit 0
            fi
            echo "FAIL: expected exit 2 for simulate_fail_after=${fail_after}, got $code"
            exit 1
          fi
          exit "$code"
