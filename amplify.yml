# AWS Amplify build spec for OET LMS (monorepo)
# Builds apps/oet-lms and deploys the static output.
# In Amplify Console: App settings > Build settings > Build image: use "Amazon Linux:2023" if needed.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 18 || nvm use 20 || true
        - node -v
        - npm ci
    build:
      commands:
        - npm run build --workspace=@amcare/oet-lms
  artifacts:
    baseDirectory: apps/oet-lms/dist
    files: '**/*'
  cache:
    paths:
      - node_modules
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
