# AWS Amplify build spec for OET LMS (monorepo)
# Replace the URL below with your Railway app URL + /api (e.g. https://myapp.up.railway.app/api)
version: 1
env:
  variables:
    VITE_API_ORIGIN: "https://YOUR-RAILWAY-APP.up.railway.app/api"
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm -v
        - npm install
    build:
      commands:
        - npm run build --workspace=@amcare/oet-lms
        - cp -r apps/oet-lms/dist dist
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules
