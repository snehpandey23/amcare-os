# AWS Amplify build spec for OET LMS (monorepo)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm -v
        - npm install
    build:
      commands:
        - npm run build --workspace=@amcare/oet-lms
        - cp -r apps/oet-lms/dist dist
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules
