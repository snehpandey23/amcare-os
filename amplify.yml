# AWS Amplify build spec for OET LMS (monorepo)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm -v
        - npm install
    build:
      commands:
        - cd apps/oet-lms && npm run build
  artifacts:
    baseDirectory: apps/oet-lms/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules
      - apps/oet-lms/node_modules
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
