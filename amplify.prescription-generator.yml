version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm -v
        - npm install
    build:
      commands:
        - npm run build --workspace=prescription-generator
  artifacts:
    baseDirectory: apps/prescription-generator/.next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules
